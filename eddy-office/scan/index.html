<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eddy Scan">
<meta name="theme-color" content="#5b3fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Eddy Scan</title>
<style>
:root{--accent:#5b3fa8;--accent-dark:#43307d;--soft:#efeaf9;--ink:#1d2129;--muted:#626a75;--line:#dde1e6;--bg:#f5f6f8;--danger:#b3261e;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) 14px 10px;background:var(--accent);color:#fff;flex:none}
.bar h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ib{min-width:44px;min-height:44px;border:0;background:transparent;color:#fff;font-size:17px;border-radius:10px;padding:0 8px}
.bar .ib:active{background:rgba(255,255,255,.15)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--sb) + 110px)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-dark)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 18px);min-height:58px;padding:0 28px;border-radius:29px;font-size:18px;box-shadow:0 4px 16px rgba(60,40,120,.35);z-index:5}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.doc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.doc img{width:54px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#eee;flex:none}
.doc .info{flex:1;min-width:0}
.doc .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .meta{color:var(--muted);font-size:13px}
.doc .act{display:flex;gap:6px;flex:none}
.doc .act button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;padding:0 10px}
.doc .act .sh{background:var(--soft);border-color:#d6cbef;color:var(--accent-dark);font-weight:650}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;margin-bottom:12px;background:#fff}
.note{color:var(--muted);font-size:13px;margin:4px 2px 12px}
/* camera */
#cam{background:#000;color:#fff}
#cam .vbox{position:relative;flex:1;overflow:hidden}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cam canvas.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cam .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:calc(var(--st) + 8px) 12px 8px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:2}
#cam .top button{min-height:44px;border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:22px;padding:0 13px;font-weight:600;font-size:15px}
#cam .top .auto.on{background:#fff;color:#000}
#cam .hint{position:absolute;left:50%;top:calc(var(--st) + 66px);transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 14px;border-radius:16px;font-size:14px;white-space:nowrap;z-index:2}
#cam .bottom{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 22px calc(var(--sb) + 18px);background:#000}
#cam .shot{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 3px #000;position:relative}
#cam .shot:active{transform:scale(.94)}
#cam .shot svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);pointer-events:none}
#cam .last{width:56px;height:72px;border-radius:8px;border:2px solid #fff;background:#222 center/cover no-repeat;position:relative}
#cam .last span{position:absolute;right:-8px;top:-8px;background:var(--accent);border-radius:12px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
#cam .done{min-height:48px;min-width:80px;border-radius:24px;border:0;background:var(--accent);color:#fff;font-weight:700;padding:0 18px}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#cam .flash.go{opacity:.85;transition:none}
#cam .err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;z-index:3;background:#000}
/* editor */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tools .wide{grid-column:1/-1;min-height:54px;font-size:17px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.pg{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.pg img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#f0f0f0;border-radius:4px;display:block}
.pg .n{font-size:12px;color:var(--muted);margin-top:4px}
.pg.busy::after{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);font-size:28px;border-radius:10px}
.sel{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;padding:0 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
/* page view and crop */
#page{background:#1b1b1f;color:#fff}
#page .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#page canvas{position:absolute;left:0;top:0}
#page .ptools{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(var(--sb) + 12px);background:#111}
#page .ptools button{flex:none;min-height:48px;border-radius:12px;border:1px solid #444;background:#26262b;color:#fff;padding:0 14px;font-weight:600}
#page .ptools button.on{background:#fff;color:#000}
#page .ptools .danger{color:#ff8a80}
/* dialog */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(var(--st) + 60px) 16px 16px;z-index:50}
#dlg .box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#dlg h2{margin:0 0 10px;font-size:18px}
#dlg input{width:100%;min-height:48px;border:1px solid #b9bfc7;border-radius:10px;padding:0 12px;font:inherit;font-size:17px}
#dlg .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
#dlg p{margin:0 0 8px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:70;color:#fff;font-weight:600}
#busy div{background:#222;padding:14px 20px;border-radius:14px}
</style>
</head>
<body>

<!-- home: saved scans -->
<section id="home" class="screen">
  <div class="bar"><h1>Eddy Scan</h1><button class="ib" id="h-photos" title="Make a PDF from photos">Photos</button></div>
  <div class="scroll">
    <input id="h-search" class="search hide" type="search" placeholder="Search scans" aria-label="Search scans">
    <div id="h-list"></div>
  </div>
  <button class="btn pri fab" id="h-new">＋ New scan</button>
</section>

<!-- camera -->
<section id="cam" class="screen hide">
  <div class="vbox">
    <video id="video" playsinline muted autoplay></video>
    <canvas class="ov" id="ov"></canvas>
    <div class="flash" id="flash"></div>
    <div class="top"><button id="c-cancel">Cancel</button><button id="c-q" title="Quality of the pages: tap to change">Standard</button><button id="c-photo" title="Use the iPhone camera for a full-resolution photo of one page">Photo</button><button id="c-auto" class="auto on" title="Take the picture by itself when the page is still">Auto</button></div>
    <div class="hint" id="c-hint">Point the camera at the page</div>
    <div class="err hide" id="c-err"></div>
  </div>
  <div class="bottom">
    <button class="last" id="c-last" aria-label="Pages taken"><span id="c-count">0</span></button>
    <button class="shot" id="c-shot" aria-label="Take picture"><svg viewBox="0 0 100 100"><circle id="c-ring" cx="50" cy="50" r="47" fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="0 296" transform="rotate(-90 50 50)"/></svg></button>
    <button class="done" id="c-done">Done</button>
  </div>
</section>

<!-- one scan: pages, share, rename -->
<section id="ed" class="screen hide">
  <div class="bar"><button class="ib" id="e-back" aria-label="Back to all scans">‹ Scans</button><h1 id="e-name" title="Tap to rename"></h1><button class="ib" id="e-rename">Rename</button></div>
  <div class="scroll">
    <div class="tools">
      <button class="btn pri wide" id="e-share">Share PDF</button>
      <button class="btn" id="e-add">＋ Scan more pages</button>
      <button class="btn" id="e-photos">＋ Add photos</button>
    </div>
    <div class="row"><span id="e-info" class="note" style="margin:0;flex:1"></span>
      <label class="note" style="margin:0">Quality <select id="e-quality" class="sel"><option value="small">Small</option><option value="std">Standard</option><option value="sharp">Sharp</option><option value="best">Best</option></select></label></div>
    <div class="pages" id="e-pages"></div>
    <p class="note" style="margin-top:16px">Tap a page to straighten the edges, rotate, change its look, move it or delete it.</p>
    <div class="row" style="margin-top:20px"><button class="btn danger" id="e-delete">Delete this scan</button></div>
  </div>
</section>

<!-- one page -->
<section id="page" class="screen hide">
  <div class="bar"><button class="ib" id="p-back">‹ Back</button><h1 id="p-title">Page</h1><button class="ib" id="p-apply" class="hide">Apply</button></div>
  <div class="stage" id="p-stage"><canvas id="p-canvas"></canvas></div>
  <div class="ptools" id="p-tools">
    <button id="p-crop">Edges</button>
    <button id="p-rot">Rotate</button>
    <button id="p-f-doc" data-f="doc">Document</button>
    <button id="p-f-gray" data-f="gray">Grey</button>
    <button id="p-f-color" data-f="color">Colour</button>
    <button id="p-left">◀ Move</button>
    <button id="p-right">Move ▶</button>
    <button id="p-del" class="danger">Delete</button>
  </div>
</section>

<div id="dlg" class="hide" role="dialog" aria-modal="true"></div>
<div id="toast" class="hide" role="status"></div>
<div id="busy" class="hide"><div id="busy-t">Working…</div></div>
<input type="file" id="f-photos" accept="image/*" multiple hidden>
<input type="file" id="f-shot" accept="image/*" capture="environment" hidden>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
/* quality settings: longest side in pixels and JPEG quality. Standard is ~200 dpi on A4, easy to read */
const Q = { small: { long: 1400, q: 0.5, label: 'Small' }, std: { long: 1750, q: 0.58, label: 'Standard' }, sharp: { long: 2300, q: 0.7, label: 'Sharp' }, best: { long: 3300, q: 0.86, label: 'Best' } };
const SRC_MAX = 4200; /* longest side kept from the camera, so Best has detail to use */
const S = { docs: [], doc: null, srcs: {}, quality: 'std', filter: 'doc', auto: true };
try { const p = JSON.parse(localStorage.getItem('eddyscan.prefs') || '{}'); if (Q[p.quality]) S.quality = p.quality; if (p.filter) S.filter = p.filter; if (p.auto === false) S.auto = false; } catch (e) { /* ignore */ }
const savePrefs = () => { try { localStorage.setItem('eddyscan.prefs', JSON.stringify({ quality: S.quality, filter: S.filter, auto: S.auto })); } catch (e) { /* ignore */ } };

/* ---------- small UI helpers ---------- */
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hide'), ms || 2600); }
function busy(on, t) { $('busy').classList.toggle('hide', !on); if (t) $('busy-t').textContent = t; }
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('hide', s.id !== id); }
function ask(title, value, okLabel, note) {
  return new Promise((res) => {
    const d = $('dlg'); d.innerHTML = '<div class="box"><h2>' + esc(title) + '</h2>' + (note ? '<p>' + esc(note) + '</p>' : '') + '<input id="dlg-in" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"><div class="btns"><button class="btn" id="dlg-no">Cancel</button><button class="btn pri" id="dlg-ok">' + esc(okLabel || 'OK') + '</button></div></div>';
    d.classList.remove('hide'); const inp = $('dlg-in'); inp.value = value || ''; setTimeout(() => { inp.focus(); inp.select(); }, 50);
    const end = (v) => { d.classList.add('hide'); d.innerHTML = ''; res(v); };
    $('dlg-ok').onclick = () => end(inp.value); $('dlg-no').onclick = () => end(null);
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); end(inp.value); } else if (e.key === 'Escape') end(null); };
  });
}
function confirmBox(title, text, okLabel) {
  return new Promise((res) => {
    const d = $('dlg'); d.innerHTML = '<div class="box"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="btns"><button class="btn" id="dlg-no">Cancel</button><button class="btn pri" id="dlg-ok" style="background:var(--danger);border-color:var(--danger)">' + esc(okLabel) + '</button></div></div>';
    d.classList.remove('hide'); const end = (v) => { d.classList.add('hide'); d.innerHTML = ''; res(v); };
    $('dlg-ok').onclick = () => end(true); $('dlg-no').onclick = () => end(false);
  });
}
const cleanName = (s) => String(s || '').replace(/[\\/:*?"<>|\u0000-\u001F]/g, ' ').replace(/\s+/g, ' ').trim().replace(/\.pdf$/i, '').slice(0, 120);
const defaultName = () => { const d = new Date(); const p = (n) => String(n).padStart(2, '0'); return 'Scan ' + d.getDate() + ' ' + d.toLocaleString('en-GB', { month: 'short' }) + ' ' + d.getFullYear() + ' ' + p(d.getHours()) + '.' + p(d.getMinutes()); };
const fmtSize = (b) => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';

/* ---------- storage (IndexedDB, on this phone only) ---------- */
const DB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('eddyscan', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath: 'id' }); r.onsuccess = () => { DB.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(mode) { return DB.db.transaction('docs', mode).objectStore('docs'); },
  all() { return new Promise((res, rej) => { const r = DB.tx('readonly').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  put(d) { return new Promise((res, rej) => { const r = DB.tx('readwrite').put(d); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  del(id) { return new Promise((res, rej) => { const r = DB.tx('readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
};
async function saveDoc(d) {
  d.updated = Date.now(); d.size = pdfSizeOf(d);
  /* store only what the PDF needs: the cleaned pages */
  const rec = { id: d.id, name: d.name, created: d.created, updated: d.updated, size: d.size, pages: d.pages.map((p) => ({ id: p.id, blob: p.blob, w: p.w, h: p.h, thumb: p.thumb })) };
  await DB.put(rec); d._pdf = null;
  if (navigator.storage && navigator.storage.persist && !S.persistAsked) { S.persistAsked = true; navigator.storage.persist().catch(() => {}); }
}

/* ---------- image processing ---------- */
function loadImg(blob) { return new Promise((res, rej) => { const u = URL.createObjectURL(blob); const i = new Image(); i.onload = () => { res(i); setTimeout(() => URL.revokeObjectURL(u), 1000); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('picture could not be read')); }; i.src = u; }); }
const toBlob = (c, type, q) => new Promise((res) => c.toBlob(res, type, q));
function canvasOf(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
/* find the page: the largest bright area, and its four corners (in 0..1 coordinates) */
/* find the page from its straight edges: the four lines that make the most paper-like four-sided shape.
   A corner hidden under something else is found where its two edges meet. */
function detectQuad(src, sw, sh, fast) {
  const W = fast ? 220 : 300, H = Math.max(60, Math.round(W * sh / sw)), N = W * H;
  const cv = canvasOf(W, H), cx = cv.getContext('2d', { willReadFrequently: true }); cx.drawImage(src, 0, 0, W, H);
  const d = cx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(N), wt = new Float32Array(N);
  for (let i = 0, j = 0; i < N; i++, j += 4) { const r = d[j], gg = d[j + 1], b = d[j + 2]; const mn = Math.min(r, gg, b), mx = Math.max(r, gg, b); g[i] = 0.3 * r + 0.59 * gg + 0.11 * b; wt[i] = mn - 0.6 * (mx - mn); }
  /* wipe out print (thin dark marks) so only the paper's outline is left: brightest-nearby, then darkest-nearby */
  const base = new Float32Array(N); for (let i = 0; i < N; i++) base[i] = g[i] + wt[i] * 0.5;
  const R = 3, tmp = new Float32Array(N), cl = new Float32Array(N);
  const pass = (src, dst, horiz, useMax) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let m = useMax ? -1e9 : 1e9; for (let k = -R; k <= R; k++) { const xx = horiz ? clamp(x + k, 0, W - 1) : x, yy = horiz ? y : clamp(y + k, 0, H - 1); const v = src[yy * W + xx]; m = useMax ? (v > m ? v : m) : (v < m ? v : m); } dst[y * W + x] = m; } };
  pass(base, tmp, true, true); pass(tmp, cl, false, true); pass(cl, tmp, true, false); pass(tmp, cl, false, false);
  for (let i = 0; i < N; i++) wt[i] = Math.min(wt[i] + 0, wt[i]); /* keep whiteness for judging */
  const wtc = new Float32Array(N); pass(wt, tmp, true, true); pass(tmp, wtc, false, true); pass(wtc, tmp, true, false); pass(tmp, wtc, false, false); wt.set(wtc);
  const bl = new Float32Array(N);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { let s2 = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s2 += cl[(y + dy) * W + x + dx]; bl[y * W + x] = s2 / 9; }
  const mag = new Float32Array(N), ang = new Float32Array(N); const hist = new Uint32Array(256);
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const i = y * W + x; const gx = bl[i - W + 1] + 2 * bl[i + 1] + bl[i + W + 1] - bl[i - W - 1] - 2 * bl[i - 1] - bl[i + W - 1];
    const gy = bl[i + W - 1] + 2 * bl[i + W] + bl[i + W + 1] - bl[i - W - 1] - 2 * bl[i - W] - bl[i - W + 1];
    const m = Math.hypot(gx, gy); mag[i] = m; ang[i] = Math.atan2(gy, gx); hist[Math.min(255, m / 4 | 0)]++;
  }
  let acc = 0, T = 40; for (let k = 255; k >= 0; k--) { acc += hist[k]; if (acc > N * 0.07) { T = Math.max(40, k * 4); break; } }
  /* straight lines (Hough): each edge point votes only near its own direction */
  const NT = 180, D = Math.ceil(Math.hypot(W, H)), NR = 2 * D + 1; const hv = new Float32Array(NT * NR);
  const cs = new Float32Array(NT), sn = new Float32Array(NT); for (let t = 0; t < NT; t++) { cs[t] = Math.cos(t * Math.PI / NT); sn[t] = Math.sin(t * Math.PI / NT); }
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
    const i = y * W + x; if (mag[i] < T) continue; let a0 = ang[i]; if (a0 < 0) a0 += Math.PI; const t0 = Math.round(a0 * NT / Math.PI);
    const wv = Math.min(2, mag[i] / T);
    for (let dt = -5; dt <= 5; dt++) { const t = (t0 + dt + NT) % NT; const r = Math.round(x * cs[t] + y * sn[t]) + D; hv[t * NR + r] += wv; }

$('p-left').addEventListener('click', async () => { const a = S.doc.pages; if (PV.i < 1) return; [a[PV.i - 1], a[PV.i]] = [a[PV.i], a[PV.i - 1]]; PV.i--; await saveDoc(S.doc); drawPage(); });
$('p-right').addEventListener('click', async () => { const a = S.doc.pages; if (PV.i >= a.length - 1) return; [a[PV.i + 1], a[PV.i]] = [a[PV.i], a[PV.i + 1]]; PV.i++; await saveDoc(S.doc); drawPage(); });
$('p-del').addEventListener('click', async () => { if (!await confirmBox('Delete this page?', 'Page ' + (PV.i + 1) + ' will be removed from the PDF.', 'Delete page')) return; const d = S.doc; d.pages.splice(PV.i, 1); await saveDoc(d); if (!d.pages.length) { renderDoc(); show('ed'); return; } PV.i = Math.min(PV.i, d.pages.length - 1); drawPage(); });
/* dragging the corners */
const stage = $('p-stage');
stage.addEventListener('pointerdown', (e) => {
  if (!PV.crop) return; const r = stage.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; const b = PV.box; let best = -1, bd = 46;
  PV.quad.forEach(([px, py], j) => { const dd = Math.hypot(b.ox + px * b.w - x, b.oy + py * b.h - y); if (dd < bd) { bd = dd; best = j; } });
  if (best >= 0) { PV.drag = best; stage.setPointerCapture(e.pointerId); e.preventDefault(); }
});
stage.addEventListener('pointermove', (e) => { if (PV.drag < 0) return; const r = stage.getBoundingClientRect(); const b = PV.box; PV.quad[PV.drag] = [clamp((e.clientX - r.left - b.ox) / b.w, 0, 1), clamp((e.clientY - r.top - b.oy) / b.h, 0, 1)]; drawPage(); });
stage.addEventListener('pointerup', () => { PV.drag = -1; });
stage.addEventListener('pointercancel', () => { PV.drag = -1; });
window.addEventListener('resize', () => { if (!$('page').classList.contains('hide')) drawPage(); });

/* ---------- start ---------- */
(async function start() {
  try { await DB.open(); await loadDocs(); } catch (e) { toast('Storage is not available, so scans cannot be kept: ' + e.message, 6000); }
  renderHome(); show('home');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
