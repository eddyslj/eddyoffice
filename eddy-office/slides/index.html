<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b7472a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Eddy Slides</title>
<style>
:root{
  --accent:#b7472a; --accent-dark:#8a3520; --accent-soft:#f8e9e4; --accent-line:#e3a493;
  --bg:#eef0f3; --panel:#ffffff; --ink:#1d2228; --muted:#4b5360; --line:#d9dde3; --line2:#c5cbd3; --bad:#a3262a;
  --warn-bg:#fdf1dc; --warn-ink:#7a4a00;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.hide{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100vh}
#titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff}
#titlebar .brand{font-weight:700;font-size:15px}
#fname{flex:1 1 120px;min-width:0;color:#fbe3dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{min-height:34px;padding:0 13px;border-radius:8px;font-weight:600}
.tb.ghost{border:1px solid var(--accent-line);background:transparent;color:#fff}
.tb.ghost:hover{background:rgba(255,255,255,.12)}
.tb.solid{border:0;background:#fff;color:var(--accent);font-weight:700}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.b{min-height:32px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.b:hover{background:var(--bg)}
.b.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.b.sq{min-width:32px;padding:0}
.b[disabled]{opacity:.45;cursor:default}
select.b{padding:0 4px;max-width:160px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.sw{display:inline-block;width:14px;height:14px;border:1px solid #8b918c;border-radius:3px;vertical-align:-2px;margin-left:3px;background:#000}
#warn{padding:8px 14px;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid #ecd9ae;display:flex;gap:12px;align-items:flex-start}
#warn ul{margin:0;padding-left:18px;flex:1}
#warn button{border:1px solid #c9a55a;background:transparent;border-radius:6px;min-height:28px;padding:0 10px;color:var(--warn-ink)}

#dropmsg{position:fixed;inset:110px 20px 50px;border:3px dashed var(--accent);border-radius:14px;background:rgba(230,237,247,.93);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent-dark);z-index:50;pointer-events:none}

#bottombar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:5px 14px;background:#e3e6ea;border-top:1px solid var(--line2)}
#status{color:var(--muted);display:flex;gap:16px}
.grow{flex:1}
.zoom{color:var(--muted)}
.zoom select{border:1px solid var(--line2);border-radius:5px;background:#fff;min-height:26px}

#menu{position:fixed;z-index:100;min-width:180px;max-width:330px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:5px}
#menu button.mi{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;min-height:32px;padding:0 10px}
#menu button.mi:hover,#menu button.mi:focus{background:var(--accent-soft)}
#menu button.mi[disabled]{opacity:.45}
#menu .ms{height:1px;background:var(--line);margin:4px 2px}
#menu .mt{padding:4px 10px;color:var(--muted);font-size:12px;font-weight:600}
#menu .pal{display:grid;grid-template-columns:repeat(10,22px);gap:3px;padding:6px}
#menu .pal button{width:22px;height:22px;border:1px solid #9aa09b;border-radius:3px;padding:0}
#menu .tgrid{display:grid;grid-template-columns:repeat(10,18px);gap:2px;padding:6px}
#menu .tgrid button{width:18px;height:18px;border:1px solid #b9c0c9;background:#fff;padding:0;border-radius:2px}
#menu .tgrid button.on{background:var(--accent-soft);border-color:var(--accent)}
#menu .tlabel{padding:0 8px 6px;color:var(--muted)}
.btn{min-height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

#dialog{position:fixed;z-index:90;left:50%;top:120px;transform:translateX(-50%);width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:16px;display:flex;flex-direction:column;gap:11px}
#dialog h3{margin:0;font-size:16px}
#dialog label.f{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-weight:600}
#dialog select,#dialog input[type=number]{min-height:36px;border:1px solid var(--line2);border-radius:7px;padding:0 8px;color:var(--ink);font-weight:400;background:#fff}
#dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#dialog .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#dialog .note{color:var(--muted)}
#toast{position:fixed;z-index:120;left:50%;bottom:50px;transform:translateX(-50%);background:#1d2228;color:#fff;padding:9px 16px;border-radius:8px;max-width:80vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}

#printview{position:fixed;inset:0;z-index:80;background:#dfe2e6;display:flex;flex-direction:column}
#printview .ptitle{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff}
#printview .ptitle .grow{color:#fbe3dc}
#printview .pmain{flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto}
@media (min-width:760px){#printview .pmain{flex-wrap:nowrap;overflow:hidden}#printview .popts{min-height:0}}
#printview .popts{flex:1 1 280px;max-width:340px;background:#fff;border-right:1px solid var(--line2);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:11px}
#printview .popts h2{margin:0;font-size:18px}
#printview .popts label.f{display:flex;flex-direction:column;gap:3px;font-weight:600;color:var(--muted)}
#printview .popts select,#printview .popts input[type=text]{min-height:38px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 8px;color:var(--ink);font-weight:400}
#printview .popts label.ck{display:flex;gap:8px;align-items:center;min-height:26px}
#printview .popts .note{color:var(--muted)}
#printview .popts .note.err{color:var(--bad);font-weight:600}
#printview .pfoot{position:sticky;bottom:-16px;background:#fff;padding:10px 0 16px;margin-bottom:-16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
#printview .bigbtn{min-height:44px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
#printview .bigbtn[disabled]{opacity:.5}
#printview .pstage{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;min-height:0}
#printview .pscroll{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
#printview .pnav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px;background:#d3d7dc}
#printview .pnav button{min-height:36px;padding:0 12px;border:1px solid #aeb5be;border-radius:8px;background:#fff;font-weight:600}
.pgwrap{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);overflow:hidden;flex:none}
.pgwrap.skip>div:first-child{opacity:.35}
.skiptag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#a3262a;color:#fff;padding:5px 12px;border-radius:6px;font-weight:700;white-space:nowrap}
#t-font{width:150px}#t-size{width:62px}
.split{display:inline-flex}.split .b:first-child{border-top-right-radius:0;border-bottom-right-radius:0}.split .b.arrow{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding:0 6px}
#main{flex:1;min-height:0;display:flex}
#thumbs{flex:none;width:214px;overflow-y:auto;background:#e4e6e9;border-right:1px solid var(--line2);padding:10px 8px 40px 6px}
.thumb{display:flex;gap:6px;align-items:flex-start;padding:6px 4px;border-radius:7px;cursor:pointer;outline:none;position:relative}
.thumb .tn{width:22px;text-align:right;color:var(--muted);font-size:12px;padding-top:2px;flex:none}
.thumb .tn .hid{display:block;font-size:9px;color:#8a3520;text-align:right}
.thumb .tbox{position:relative;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #c5cbd3;border-radius:2px;flex:none;pointer-events:none}
.thumb .tscale{transform-origin:0 0;position:absolute;left:0;top:0}
.thumb:hover .tbox{box-shadow:0 0 0 2px #d8a597}
.thumb.on .tbox{box-shadow:0 0 0 3px var(--accent)}
.thumb:focus-visible .tbox{box-shadow:0 0 0 3px var(--accent),0 0 0 6px #fff}
.thumb.ishidden .tbox{opacity:.5}
.thumb.dropb::before,.thumb.dropa::after{content:"";position:absolute;left:30px;right:6px;height:3px;background:var(--accent);border-radius:2px}
.thumb.dropb::before{top:-2px}.thumb.dropa::after{bottom:-2px}
#stage{flex:1;min-width:0;overflow:auto;display:flex;background:#d5d8dc;position:relative}
#canvaswrap{margin:auto;flex:none;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;cursor:default}
#canvas .slide .layer.ls .shp{cursor:move}
#canvas .slide .txb[contenteditable="true"]{cursor:text;caret-color:auto}
#canvas .slide .shp.emptyph{outline:1px dashed #9aa0a8;outline-offset:-1px}
#canvas .slide .txb.empty:not([contenteditable="true"])>.tp:first-child::before{content:attr(data-prompt);color:#8a8f96}
#canvas .slide .hiddenshp{opacity:.35}
#canvas .slide.ishidden{opacity:.55}
#canvas .slide .bgshp{pointer-events:none}
#selbox{position:absolute;border:1.5px solid var(--accent);pointer-events:none;z-index:5;transform-origin:center center}
#selbox.editing{border-style:dashed}
#selbox .hd{position:absolute;width:11px;height:11px;margin:-6px 0 0 -6px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;pointer-events:auto}
#selbox.editing .hd{display:none}
#selbox .hd[data-h=nw]{left:0;top:0;cursor:nwse-resize}#selbox .hd[data-h=n]{left:50%;top:0;cursor:ns-resize}#selbox .hd[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#selbox .hd[data-h=e]{left:100%;top:50%;cursor:ew-resize}#selbox .hd[data-h=se]{left:100%;top:100%;cursor:nwse-resize}#selbox .hd[data-h=s]{left:50%;top:100%;cursor:ns-resize}
#selbox .hd[data-h=sw]{left:0;top:100%;cursor:nesw-resize}#selbox .hd[data-h=w]{left:0;top:50%;cursor:ew-resize}
#selbox.line .hd:not([data-h=nw]):not([data-h=se]){display:none}
#guides{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:4}
.guide{position:absolute;background:#e04f2b}.guide.v{top:0;bottom:0;width:1px}.guide.h{left:0;right:0;height:1px}
#present{position:fixed;inset:0;z-index:200;background:#000;outline:none;cursor:default;overflow:hidden}
#present .pstage{position:absolute;inset:0}
#present .pslide{position:absolute;transform-origin:0 0}
#present.black .pstage{visibility:hidden}
#present.white{background:#fff}#present.white .pstage{visibility:hidden}
#present .pend{color:#ddd;font:18px system-ui,sans-serif;position:absolute;left:50%;top:40%;transform:translateX(-50%)}
#present .pbar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;opacity:0;transition:opacity .2s;background:rgba(30,30,30,.75);border-radius:9px;padding:5px 8px;color:#eee}
#present:hover .pbar{opacity:1}
#present .pbar button{min-height:32px;min-width:34px;border:1px solid #666;border-radius:7px;background:#2a2a2a;color:#eee;font-size:15px}
#present .plink{cursor:pointer;text-decoration:underline}
#printview .popts input[type=text]{min-height:38px}
#status{color:var(--muted)}


.slide{position:relative;overflow:hidden;color:#000;font-family:Calibri,Carlito,Arial,sans-serif;line-height:1.2;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:left}
.slide .layer{position:absolute;left:0;top:0;right:0;bottom:0}
.slide .shp{position:absolute;box-sizing:border-box}
.slide .shp>svg.geo{position:absolute;left:0;top:0;overflow:visible}
.slide .txb{position:absolute;display:flex;flex-direction:column;white-space:pre-wrap;overflow-wrap:break-word;word-wrap:break-word;outline:none;box-sizing:border-box;overflow:visible;cursor:inherit}
.slide .txb.nowrap{white-space:pre}
.slide .txb.vert{writing-mode:vertical-rl}
.slide .txb.vert270{writing-mode:vertical-rl;transform:rotate(180deg)}
.slide .tp{margin:0;flex:none;min-height:.6em}
.slide .tp[data-marker]::before{content:attr(data-marker);display:inline-block;min-width:var(--hang,0px);text-indent:0;color:var(--mk-c);font-size:var(--mk-s);font-family:var(--mk-f);font-weight:normal;font-style:normal;text-decoration:none;white-space:pre;line-height:1}
.slide .picclip{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
.slide .picclip.nopic{background:#f0f1f2;border:1px dashed #a3a8ae;color:#5f6670;display:flex;align-items:center;justify-content:center;font:13px Arial,sans-serif;text-align:center;padding:6px}
.slide .tblw{position:absolute;left:0;top:0}
.slide table.stbl{border-collapse:collapse;table-layout:fixed}
.slide table.stbl td{overflow:hidden;position:relative}
.slide td .txb.cell{position:static;display:block;min-height:1em}
.slide .chartbox{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#666;font:14px Arial,sans-serif}
.slide .chartbox svg{position:absolute;left:0;top:0}
.slide .fld{white-space:pre}


</style>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand">Eddy Slides</div>
    <div id="fname" title="File name">Presentation1.pptx</div>
    <button type="button" class="tb ghost" id="btn-new">New</button>
    <button type="button" class="tb ghost" id="btn-open">Open file</button>
    <button type="button" class="tb ghost" id="btn-save">Save as .pptx</button>
    <button type="button" class="tb ghost hide" id="btn-copy" title="Download a copy and leave the original file as it is">Save a copy</button>
    <button type="button" class="tb ghost" id="btn-present" title="Present from the first slide (F5)">Present</button>
    <button type="button" class="tb ghost" id="btn-present-here" title="Present from this slide (Shift+F5)">From this slide</button>
    <button type="button" class="tb solid" id="btn-print">Print</button>
  </header>

  <div id="toolbar" role="toolbar" aria-label="Editing">
    <button type="button" class="b" id="t-undo" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" class="b" id="t-redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <span class="split"><button type="button" class="b" id="t-newslide" title="Add a slide after this one (Ctrl+M)">New slide</button><button type="button" class="b arrow" id="t-newslide-m" title="Choose the layout of the new slide" aria-label="New slide layouts">▾</button></span>
    <span class="sep"></span>
    <select id="t-font" class="b" aria-label="Font" title="Font"></select>
    <select id="t-size" class="b" aria-label="Font size" title="Font size"></select>
    <button type="button" class="b sq" id="t-bold" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button type="button" class="b sq" id="t-italic" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button type="button" class="b sq" id="t-underline" aria-label="Underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <button type="button" class="b sq" id="t-strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
    <button type="button" class="b" id="t-color" title="Text colour">Text colour <span class="sw" id="sw-color"></span></button>
    <button type="button" class="b" id="t-hl" title="Highlight colour">Highlight <span class="sw" style="background:#ffff00"></span></button>
    <span class="sep"></span>
    <button type="button" class="b" id="t-align" title="Alignment">Align ▾</button>
    <button type="button" class="b" id="t-bullets" title="Bullet list">• List</button>
    <button type="button" class="b" id="t-numbers" title="Numbered list">1. List</button>
    <button type="button" class="b sq" id="t-outdent" aria-label="Decrease list level" title="Decrease list level (Shift+Tab)">⇤</button>
    <button type="button" class="b sq" id="t-indent" aria-label="Increase list level" title="Increase list level (Tab)">⇥</button>
    <button type="button" class="b" id="t-spacing" title="Line spacing">Spacing ▾</button>
    <span class="sep"></span>
    <button type="button" class="b" id="t-textbox" title="Insert a text box">Text box</button>
    <button type="button" class="b" id="t-shape" title="Insert a shape or line">Shapes ▾</button>
    <button type="button" class="b" id="t-pic" title="Insert a picture (you can also paste or drop one)">Picture</button>
    <button type="button" class="b" id="t-table" title="Insert or change a table">Table ▾</button>
    <span class="sep"></span>
    <button type="button" class="b" id="t-fill" title="Fill colour of the selected shape">Fill ▾</button>
    <button type="button" class="b" id="t-line" title="Outline of the selected shape">Outline ▾</button>
    <button type="button" class="b" id="t-arrange" title="Order, duplicate, delete">Arrange ▾</button>
    <button type="button" class="b" id="t-clear" title="Remove character formatting from the selected text">Clear formatting</button>
  </div>

  <div id="warn" class="hide" role="status"></div>

  <div id="main">
    <nav id="thumbs" aria-label="Slides"></nav>
    <div id="stage">
      <div id="canvaswrap">
        <div id="canvas"></div>
        <div id="guides" aria-hidden="true"></div>
        <div id="selbox" class="hide" aria-hidden="true"><div class="hd" data-h="nw"></div><div class="hd" data-h="n"></div><div class="hd" data-h="ne"></div><div class="hd" data-h="e"></div><div class="hd" data-h="se"></div><div class="hd" data-h="s"></div><div class="hd" data-h="sw"></div><div class="hd" data-h="w"></div></div>
      </div>
    </div>
  </div>

  <footer id="bottombar">
    <div id="status"></div>
    <div class="grow"></div>
    <label class="zoom">Zoom <select id="zoom" aria-label="Zoom"><option value="fit" selected>Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
  </footer>
</div>

<div id="present" class="hide" tabindex="-1"></div>
<div id="printview" class="hide" tabindex="-1"></div>
<div id="dropmsg" class="hide">Drop a PowerPoint file to open it, or a picture to add it</div>
<div id="menu" class="hide" role="menu"></div>
<div id="dialog" class="hide" role="dialog" aria-modal="true"></div>
<div id="toast" class="hide" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".pptx,.pptm,.ppsx,.potx,application/vnd.openxmlformats-officedocument.presentationml.presentation" hidden>
<input type="file" id="picfile" accept="image/*" hidden>

<script>
/* Opening files from the computer and saving back to the same file.
   Works when the app is installed (Open with… / double-click) and with the file picker. */
(function () {
  const L = window.EddyLink = { handle: null, o: null };
  L.canPick = typeof window.showOpenFilePicker === 'function';

  L.setup = function (o) {
    L.o = o;
    if ('launchQueue' in window && window.launchQueue && window.launchQueue.setConsumer) {
      window.launchQueue.setConsumer(async (p) => { if (p && p.files && p.files.length) await L.openHandle(p.files[0]); });
    }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      const reg = () => navigator.serviceWorker.register('sw.js').catch((e) => console.warn('offline helper not registered', e));
      if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
    }
    L.sync();
    if (/[?&]shared=1/.test(location.search)) L.openShared();
  };

  /* a file sent here from the Android Share menu (the offline helper keeps it for us) */
  L.openShared = async function () {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (!('caches' in window)) return;
    try {
      const c = await caches.open('eddy-inbox'); const key = new URL('shared-file', location.href).href;
      const res = await c.match(key); if (!res) { L.o.toast('The shared file did not arrive. Please try sharing it again.', 7000); return; }
      await c.delete(key);
      const name = decodeURIComponent(res.headers.get('x-name') || 'shared-file'); const blob = await res.blob();
      await L.o.open(new File([blob], name, { type: blob.type }));
    } catch (e) { console.error(e); L.o.toast('The shared file could not be opened: ' + (e && e.message ? e.message : e), 8000); }
  };

  /* name of the linked file, if Save can write straight back to it */
  L.name = function () { return L.handle ? L.handle.name : ''; };
  L.sync = function () { if (L.o && L.o.changed) L.o.changed(); };
  L.forget = function () { L.handle = null; L.sync(); };

  L.openHandle = async function (h) {
    try {
      const f = await h.getFile();
      const ok = await L.o.open(f);
      if (ok) { L.handle = h; L.sync(); }
      return ok;
    } catch (e) { console.error(e); L.o.toast('This file could not be opened: ' + (e && e.message ? e.message : e), 8000); return false; }
  };

  L.pick = async function () {
    if (!L.canPick) { L.o.fallbackPick(); return; }
    let hs;
    try { hs = await window.showOpenFilePicker({ types: L.o.types, multiple: false }); }
    catch (e) { if (e && e.name === 'AbortError') return; console.warn(e); L.o.fallbackPick(); return; }
    if (hs && hs[0]) await L.openHandle(hs[0]);
  };

  /* returns true when the bytes were written into the linked file */
  L.writeBack = async function (bytes) {
    const h = L.handle; L.lastError = null;
    if (!h || typeof h.createWritable !== 'function') return false;
    try {
      if (h.queryPermission) {
        let s = await h.queryPermission({ mode: 'readwrite' });
        if (s !== 'granted' && h.requestPermission) s = await h.requestPermission({ mode: 'readwrite' });
        if (s !== 'granted') { L.lastError = 'permission'; return false; }
      }
      const w = await h.createWritable(); await w.write(bytes); await w.close();
      return true;
    } catch (e) { console.error(e); L.lastError = e; return false; }
  };

  L.failText = function () {
    if (L.lastError === 'permission') return 'Eddy was not allowed to change the original file, so a copy was saved to your downloads folder instead.';
    return 'The original file could not be changed (it may be open in another program), so a copy was saved to your downloads folder instead.';
  };
})();

'use strict';

/* Eddy Slides — presenting full screen */
(function () {
  const V = { list: [], k: 0, black: null, typed: '' };
  const box = $('present');
  function fit() {
    const D = EP.deck; const W = EP.px(D.W), H = EP.px(D.H); const z = Math.min(window.innerWidth / W, window.innerHeight / H);
    const s = box.querySelector('.pslide'); if (!s) return;

  }
  function show() {
    const D = EP.deck; const i = V.list[V.k]; const st = box.querySelector('.pstage'); st.innerHTML = '';
    if (V.k >= V.list.length) { st.innerHTML = '<div class="pend">End of slide show. Click or press Esc to exit.</div>'; count(); return; }
    const el = EP.renderSlide(D.slides[i], { mode: 'present', num: i + 1 }); el.classList.add('pslide'); st.appendChild(el);
    for (const a of el.querySelectorAll('[data-href]')) { a.classList.add('plink'); a.addEventListener('click', (e) => { e.stopPropagation(); window.open(a.dataset.href, '_blank', 'noopener'); }); }
    fit(); count();
  }

  const go = (d) => { V.k = clamp(V.k + d, 0, V.list.length); V.black = null; box.classList.remove('black', 'white'); show(); };
  EP.present = function (fromCurrent) {
    if (EP.editing) EP.stopEdit(); const D = EP.deck;
    V.list = D.slides.map((s, i) => i).filter((i) => D.slides[i].part.doc.documentElement.getAttribute('show') !== '0');
    if (!V.list.length) return EP.toast('All slides are hidden, so there is nothing to show.');
    V.k = 0; if (fromCurrent) { const k = V.list.findIndex((i) => i >= EP.cur); V.k = k < 0 ? 0 : k; }
    box.innerHTML = '<div class="pstage"></div><div class="pbar"><button type="button" id="pr-prev" title="Previous (←)">‹</button><span class="pcount"></span><button type="button" id="pr-next" title="Next (→ or Space)">›</button><button type="button" id="pr-exit" title="End show (Esc)">End show</button></div>';
    box.classList.remove('hide', 'black', 'white'); show();
    box.querySelector('#pr-prev').addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
    box.querySelector('#pr-next').addEventListener('click', (e) => { e.stopPropagation(); go(1); });
    box.querySelector('#pr-exit').addEventListener('click', (e) => { e.stopPropagation(); EP.endShow(); });

  box.addEventListener('contextmenu', (e) => { e.preventDefault(); go(-1); });

    V.typed = '';

    EP.syncUndo();
  };
  document.addEventListener('selectionchange', () => { if (EP.editing) { clearTimeout(EP._st); EP._st = setTimeout(EP.syncToolbar, 80); } });

  /* ---------- warnings about things that are only partly supported ---------- */
  function showWarnings() {
    const D = EP.deck; const w = (D.warnings || []).slice(); const all = D.slides.map((s) => s.part.doc);
    const any = (name) => all.some((d) => EP.desc(d, name).length);
    if (any('timing') && all.some((d) => EP.desc(d, 'par').length)) w.push('Animations are not played: everything on a slide appears at once. They are kept in the file.');
    if (any('transition')) w.push('Slide transitions are not played when presenting. They are kept in the file.');
    if (D.slides.some((s) => Object.values(s.part.rels).some((r) => /\/chart$/.test(r.type)))) w.push('Charts are drawn simply from their saved numbers and cannot be edited here. They stay as they are in the file.');
    if (D.slides.some((s) => Object.values(s.part.rels).some((r) => /diagram/.test(r.type)))) w.push('SmartArt is shown but cannot be edited here.');
    if (Object.values(D.media).some((m) => !m.shown)) w.push('Some pictures are in an old Windows format (EMF/WMF) that browsers cannot show; they appear as grey boxes but stay in the file.');
    if (D.slides.some((s) => Object.values(s.part.rels).some((r) => /\/(video|audio|media)$/.test(r.type)))) w.push('Videos and sounds do not play here.');
    const box = $('warn'); if (!w.length) { box.classList.add('hide'); box.innerHTML = ''; return; }
    box.innerHTML = '<ul>' + w.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul><button type="button" id="warn-x">Dismiss</button>'; box.classList.remove('hide');
    $('warn-x').addEventListener('click', () => { box.classList.add('hide'); EP.applyZoom(); });
  }

  /* ---------- files ---------- */
  function afterLoad() {
    EP.undoState.stack = []; EP.undoState.redo = []; EP.dirty = false; EP.sel = null; EP.editing = null;
    EP.fillFonts(); EP.renderThumbs(); EP.showSlide(0); showWarnings(); EP.syncTitle(); EP.applyZoom();
  }
  EP.openFile = async function (file) {
    if (EP.dirty && !window.confirm('You have unsaved changes in ' + EP.deck.name + '. Open another file and lose them?')) return false;
    const name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
    if (ext === 'ppt' || ext === 'pps') { EP.toast('Old .ppt files are not supported. Open it in PowerPoint and save it as .pptx first.', 7000); return false; }
    if (!/^(pptx|pptm|ppsx|ppsm|potx)$/.test(ext)) { EP.toast('Eddy Slides opens PowerPoint .pptx files.', 5000); return false; }
    $('toast').classList.add('hide');
    try {
      const D = await EP.loadPptx(await file.arrayBuffer(), name);
      if (!D.slides.length) { EP.deck = D; const lp = EP.layoutList()[0]; if (lp) { EP.cur = -1; EP.newSlide(lp, 0); } }
      EP.deck = D; EP.base = []; EddyLink.handle = null; afterLoad(); return true;
    } catch (e) { console.error(e); EP.toast('This file could not be opened: ' + (e && e.message ? e.message : e), 8000); return false; }
  };
  EP.linked = () => !!EddyLink.handle && /\.(pptx|pptm|ppsx|potx)$/i.test(EddyLink.name());
  const MIMES = { pptm: 'application/vnd.ms-powerpoint.presentation.macroEnabled.12', ppsx: 'application/vnd.openxmlformats-officedocument.presentationml.slideshow', potx: 'application/vnd.openxmlformats-officedocument.presentationml.template' };
  EP.save = async function (copy) {
    try {
      const bytes = await EP.savePptx(); let name = EP.deck.name; if (!/\.(pptx|pptm|ppsx|potx)$/i.test(name)) name += '.pptx';
      const mime = MIMES[(name.split('.').pop() || '').toLowerCase()] || 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
      if (copy !== true && EP.linked()) {
        if (await EddyLink.writeBack(bytes)) { EP.dirty = false; EP.syncTitle(); EP.toast('Saved your changes to ' + EddyLink.name() + '.'); return; }
        EP.deck.name = name; EP.download(bytes, name, mime); EP.dirty = false; EP.syncTitle(); EP.toast(EddyLink.failText(), 9000); return;
      }
      EP.deck.name = name; EP.download(bytes, name, mime); EP.dirty = false; EP.syncTitle(); EP.toast('Saved ' + name + ' to your downloads folder.');
    } catch (e) { console.error(e); EP.toast('The file could not be saved: ' + (e && e.message ? e.message : e), 8000); }
  };
  $('btn-open').addEventListener('click', () => EddyLink.pick());
  $('file').addEventListener('change', () => { const f = $('file').files[0]; $('file').value = ''; if (f) EP.openFile(f); });
  $('btn-new').addEventListener('click', async () => { if (EP.dirty && !window.confirm('You have unsaved changes. Start a new presentation and lose them?')) return; EddyLink.handle = null; EP.base = []; await EP.newDeck(); afterLoad(); });
  $('btn-save').addEventListener('click', () => EP.save());
  $('btn-copy').addEventListener('click', () => EP.save(true));
  $('btn-present').addEventListener('click', () => EP.present(false));
  $('btn-present-here').addEventListener('click', () => EP.present(true));
  $('btn-print').addEventListener('click', () => EP.printOpen());
  $('zoom').addEventListener('change', () => { EP.applyZoom(); });
  document.addEventListener('keydown', (e) => {
    if (!$('present').classList.contains('hide')) return;
    if (e.key === 'F5') { e.preventDefault(); EP.present(e.shiftKey); return; }
    const ctrl = e.ctrlKey || e.metaKey; if (!ctrl) return; const k = e.key.toLowerCase();
    if (!$('printview').classList.contains('hide')) { if (k === 'p') { e.preventDefault(); EP.print(); } return; }
    if (k === 's') { e.preventDefault(); EP.save(); } else if (k === 'p') { e.preventDefault(); EP.printOpen(); } else if (k === 'o') { e.preventDefault(); EddyLink.pick(); }
    else if (k === 'm') { e.preventDefault(); EP.newSlide(); }
    else if (!EP.editing && (k === 'z' || k === 'y')) { if (e.target.closest && e.target.closest('input,select,textarea')) return; e.preventDefault(); if (k === 'z' && !e.shiftKey) EP.undo(); else EP.redo(); }
  });
  /* pictures pasted onto the slide */
  document.addEventListener('paste', (e) => { if (EP.editing || !$('printview').classList.contains('hide')) return; if (e.target.closest && e.target.closest('input,textarea')) return; const f = Array.from((e.clipboardData || {}).files || []).find((x) => /^image\//.test(x.type)); if (f) { e.preventDefault(); EP.insertPicture(f); } });
  let depth = 0; const isFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (isFiles(e)) { depth++; $('dropmsg').classList.remove('hide'); e.preventDefault(); } });
  window.addEventListener('dragover', (e) => { if (isFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('dropmsg').classList.add('hide'); });
  window.addEventListener('drop', (e) => {
    depth = 0; $('dropmsg').classList.add('hide'); if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
    const f = e.dataTransfer.files[0]; if (/^image\//.test(f.type)) EP.insertPicture(f); else EP.openFile(f);
  });
  window.addEventListener('beforeunload', (e) => { if (EP.dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* print preview pages use the same page styles as the printout */
  const ps = document.createElement('style'); ps.textContent = EP.PAGE_CSS; document.head.appendChild(ps);
  /* ---------- start ---------- */
  (async function start() {
    await EP.newDeck(); afterLoad();
    EddyLink.setup({ open: (f) => EP.openFile(f), toast: (t, ms) => EP.toast(t, ms), fallbackPick: () => $('file').click(), changed: () => EP.syncTitle(),
      types: [{ description: 'PowerPoint presentation', accept: { 'application/vnd.openxmlformats-officedocument.presentationml.presentation': ['.pptx'], 'application/vnd.ms-powerpoint.presentation.macroEnabled.12': ['.pptm'], 'application/vnd.openxmlformats-officedocument.presentationml.slideshow': ['.ppsx'] } }] });
    setTimeout(() => { if (EP.deck.isNew && !EddyLink.handle && !EP.dirty) EP.toast('Click "Open file" (or drop a PowerPoint file here) to open a .pptx, or start typing on this slide.', 6000); }, 500);
  })();
})();

</script>
</body>
</html>
