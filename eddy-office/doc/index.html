<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b579a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Eddy Doc</title>
<style>
:root{
  --accent:#2b579a; --accent-dark:#1e3f73; --accent-soft:#e6edf7; --accent-line:#8fa9d1;
  --bg:#eef0f3; --panel:#ffffff; --ink:#1d2228; --muted:#4b5360; --line:#d9dde3; --line2:#c5cbd3; --bad:#a3262a;
  --warn-bg:#fdf1dc; --warn-ink:#7a4a00;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.hide{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:flex;flex-direction:column;height:100vh}
#titlebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff}
#titlebar .brand{font-weight:700;font-size:15px}
#fname{flex:1 1 120px;min-width:0;color:#dbe5f3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{min-height:34px;padding:0 13px;border-radius:8px;font-weight:600}
.tb.ghost{border:1px solid var(--accent-line);background:transparent;color:#fff}
.tb.ghost:hover{background:rgba(255,255,255,.12)}
.tb.solid{border:0;background:#fff;color:var(--accent);font-weight:700}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.b{min-height:32px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.b:hover{background:var(--bg)}
.b.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.b.sq{min-width:32px;padding:0}
.b[disabled]{opacity:.45;cursor:default}
select.b{padding:0 4px;max-width:160px}
#t-style{width:140px}#t-font{width:140px}#t-size{width:58px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.sw{display:inline-block;width:14px;height:14px;border:1px solid #8b918c;border-radius:3px;vertical-align:-2px;margin-left:3px;background:#000}
#warn{padding:8px 14px;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid #ecd9ae;display:flex;gap:12px;align-items:flex-start}
#warn ul{margin:0;padding-left:18px;flex:1}
#warn button{border:1px solid #c9a55a;background:transparent;border-radius:6px;min-height:28px;padding:0 10px;color:var(--warn-ink)}

#scroller{flex:1;min-height:0;overflow:auto;position:relative}
#pagewrap{padding:24px 16px 60px;min-width:min-content}
.page{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04)}
#doc{outline:none;position:relative;z-index:1}
#marks{position:absolute;left:0;right:0;top:0;pointer-events:none;z-index:2}
.pgmark{position:absolute;left:0;right:0;height:0;border-top:2px dashed #b9c3d0}
.pgmark span{position:absolute;right:6px;top:-10px;background:#fff;color:#6b7684;font-size:11px;padding:0 6px;border:1px solid #d3d9e1;border-radius:9px}
#imgbox{position:absolute;border:2px solid var(--accent);pointer-events:none;z-index:3}
#imgbox .h{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:var(--accent);border:2px solid #fff;border-radius:2px;cursor:nwse-resize;pointer-events:auto}
#dropmsg{position:fixed;inset:110px 20px 50px;border:3px dashed var(--accent);border-radius:14px;background:rgba(230,237,247,.93);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--accent-dark);z-index:50;pointer-events:none}
#measure{position:absolute;left:-30000px;top:0;visibility:hidden}

#bottombar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:5px 14px;background:#e3e6ea;border-top:1px solid var(--line2)}
#status{color:var(--muted);display:flex;gap:16px}
.grow{flex:1}
.zoom{color:var(--muted)}
.zoom select{border:1px solid var(--line2);border-radius:5px;background:#fff;min-height:26px}

#menu{position:fixed;z-index:100;min-width:180px;max-width:330px;background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:5px}
#menu button.mi{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;min-height:32px;padding:0 10px}
#menu button.mi:hover,#menu button.mi:focus{background:var(--accent-soft)}
#menu button.mi[disabled]{opacity:.45}
#menu .ms{height:1px;background:var(--line);margin:4px 2px}
#menu .mt{padding:4px 10px;color:var(--muted);font-size:12px;font-weight:600}
#menu .pal{display:grid;grid-template-columns:repeat(10,22px);gap:3px;padding:6px}
#menu .pal button{width:22px;height:22px;border:1px solid #9aa09b;border-radius:3px;padding:0}
#menu .tgrid{display:grid;grid-template-columns:repeat(10,18px);gap:2px;padding:6px}
#menu .tgrid button{width:18px;height:18px;border:1px solid #b9c0c9;background:#fff;padding:0;border-radius:2px}
#menu .tgrid button.on{background:var(--accent-soft);border-color:var(--accent)}
#menu .tlabel{padding:0 8px 6px;color:var(--muted)}
.btn{min-height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line2);background:#fff;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

#dialog{position:fixed;z-index:90;left:50%;top:120px;transform:translateX(-50%);width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.28);padding:16px;display:flex;flex-direction:column;gap:11px}
#dialog h3{margin:0;font-size:16px}
#dialog label.f{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-weight:600}
#dialog select,#dialog input[type=number]{min-height:36px;border:1px solid var(--line2);border-radius:7px;padding:0 8px;color:var(--ink);font-weight:400;background:#fff}
#dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#dialog .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#dialog .note{color:var(--muted)}
#toast{position:fixed;z-index:120;left:50%;bottom:50px;transform:translateX(-50%);background:#1d2228;color:#fff;padding:9px 16px;border-radius:8px;max-width:80vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}

#printview{position:fixed;inset:0;z-index:80;background:#dfe2e6;display:flex;flex-direction:column}
#printview .ptitle{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent);color:#fff}
#printview .ptitle .grow{color:#dbe5f3}
#printview .pbody{flex:1;min-height:0;display:flex;flex-wrap:wrap;overflow:auto}
@media (min-width:760px){#printview .pbody{flex-wrap:nowrap;overflow:hidden}#printview .popts{min-height:0}}
#printview .popts{flex:1 1 280px;max-width:340px;background:#fff;border-right:1px solid var(--line2);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:11px}
#printview .popts h2{margin:0;font-size:18px}
#printview .popts label.f{display:flex;flex-direction:column;gap:3px;font-weight:600;color:var(--muted)}
#printview .popts select,#printview .popts input[type=text]{min-height:38px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 8px;color:var(--ink);font-weight:400}
#printview .popts label.ck{display:flex;gap:8px;align-items:center;min-height:26px}
#printview .popts .note{color:var(--muted)}
#printview .popts .note.err{color:var(--bad);font-weight:600}
#printview .pfoot{position:sticky;bottom:-16px;background:#fff;padding:10px 0 16px;margin-bottom:-16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
#printview .bigbtn{min-height:44px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
#printview .bigbtn[disabled]{opacity:.5}
#printview .pstage{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;min-height:0}
#printview .pscroll{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
#printview .pnav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:8px;background:#d3d7dc}
#printview .pnav button{min-height:36px;padding:0 12px;border:1px solid #aeb5be;border-radius:8px;background:#fff;font-weight:600}
.pgwrap{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);overflow:hidden;flex:none}
.pgwrap.skip>div:first-child{opacity:.35}
.skiptag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#a3262a;color:#fff;padding:5px 12px;border-radius:6px;font-weight:700;white-space:nowrap}

.doc{font-family:Calibri,Carlito,Arial,sans-serif;font-size:14.67px;color:#000;line-height:1.15;word-wrap:break-word;overflow-wrap:break-word}
.doc p{margin:0;white-space:pre-wrap;tab-size:48px;-moz-tab-size:48px;min-height:1em}
.doc p[data-marker]::before{content:attr(data-marker);display:inline-block;min-width:var(--hang,24px);text-indent:0;font-style:normal;font-weight:inherit;text-decoration:none;white-space:pre}
.doc p[data-cont]::before{content:none}
.doc p[data-sect]::after{content:"Section break";display:block;margin-top:4px;border-top:1px dashed #9aa4b1;color:#8a94a1;font:10px Arial,sans-serif;text-align:center;padding-top:1px;text-indent:0}
.doc a{color:inherit;text-decoration:none}
.doc .va-sup{vertical-align:super;font-size:65%}.doc .va-sub{vertical-align:sub;font-size:65%}
.doc table.dtbl{border-collapse:collapse;table-layout:fixed;margin:0}
.doc table.dtbl td{vertical-align:top;padding:0 7px;overflow-wrap:break-word;word-wrap:break-word}
.doc table.dtbl td>p{white-space:pre-wrap}
.doc .atom{display:inline}
.doc .atomh,.doc .atomb{display:none}
.doc .pgb{display:block;height:0;margin:6px 0 14px;border-top:1px dashed #9aa4b1;position:relative;user-select:none}
.doc .pgb::after{content:"Page break";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#8a94a1;font:10px Arial,sans-serif;padding:0 6px}
.doc .fnref{vertical-align:super;font-size:65%;color:#2b579a}
.doc .shape{display:inline-block;max-width:100%;border:1px dashed #9aa4b1;background:#f6f7f9;color:#4b5360;padding:2px 6px;font-size:12px;white-space:pre-wrap;vertical-align:middle}
.doc img.dimg{max-width:none;vertical-align:bottom}
.doc .sdt{display:block}
.ppage{position:relative;background:#fff;overflow:hidden;color:#000}
.ppage .pbody{position:absolute;overflow:hidden}
.ppage .phdr,.ppage .pftr{position:absolute;overflow:hidden}
.ppage .pgb{border-top:0}.ppage .pgb::after{content:none}
.ppage p[data-sect]::after{content:none}


</style>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand">Eddy Doc</div>
    <div id="fname" title="File name">Document1.docx</div>
    <button type="button" class="tb ghost" id="btn-new">New</button>
    <button type="button" class="tb ghost" id="btn-open">Open file</button>
    <button type="button" class="tb ghost" id="btn-save">Save as .docx</button>
    <button type="button" class="tb ghost hide" id="btn-copy" title="Download a copy and leave the original file as it is">Save a copy</button>
    <button type="button" class="tb ghost" id="btn-setup">Page setup</button>
    <button type="button" class="tb solid" id="btn-print">Print</button>
  </header>

  <div id="toolbar" role="toolbar" aria-label="Formatting">
    <button type="button" class="b" id="t-undo" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" class="b" id="t-redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <select id="t-style" class="b" aria-label="Paragraph style" title="Paragraph style"></select>
    <select id="t-font" class="b" aria-label="Font" title="Font"></select>
    <select id="t-size" class="b" aria-label="Font size" title="Font size"></select>
    <button type="button" class="b sq" id="t-bold" aria-label="Bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button type="button" class="b sq" id="t-italic" aria-label="Italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button type="button" class="b sq" id="t-underline" aria-label="Underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <button type="button" class="b sq" id="t-strike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
    <button type="button" class="b" id="t-color" title="Text colour">Text colour <span class="sw" id="sw-color"></span></button>
    <button type="button" class="b" id="t-hl" title="Highlight colour">Highlight <span class="sw" id="sw-hl" style="background:#ffff00"></span></button>
    <span class="sep"></span>
    <button type="button" class="b" id="t-align" title="Alignment">Align ▾</button>
    <button type="button" class="b" id="t-bullets" title="Bullet list">• List</button>
    <button type="button" class="b" id="t-numbers" title="Numbered list">1. List</button>
    <button type="button" class="b sq" id="t-outdent" aria-label="Decrease indent" title="Decrease indent">⇤</button>
    <button type="button" class="b sq" id="t-indent" aria-label="Increase indent" title="Increase indent">⇥</button>
    <button type="button" class="b" id="t-spacing" title="Line spacing">Spacing ▾</button>
    <span class="sep"></span>
    <button type="button" class="b" id="t-table" title="Insert or change a table">Table ▾</button>
    <button type="button" class="b" id="t-pic" title="Insert a picture (you can also paste or drop one)">Picture</button>
    <button type="button" class="b" id="t-pgbreak" title="Start a new page here (Ctrl+Enter)">Page break</button>
    <button type="button" class="b" id="t-clear" title="Remove character formatting from the selected text">Clear formatting</button>
  </div>

  <div id="warn" class="hide" role="status"></div>

  <div id="scroller">
    <div id="pagewrap">
      <div class="page" id="page">
        <div id="marks" aria-hidden="true"></div>
        <div id="doc" class="doc" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document"></div>
        <div id="imgbox" class="hide" aria-hidden="true"><div class="h"></div></div>
      </div>
    </div>
    <div id="dropmsg" class="hide">Drop a Word file to open it, or a picture to insert it</div>
  </div>

  <footer id="bottombar">
    <span id="status"></span>
    <span class="grow"></span>
    <label class="zoom">Zoom
      <select id="zoom" aria-label="Zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="0.9">90%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
    </label>
  </footer>
</div>

<div id="measure" aria-hidden="true"></div>
<div id="printview" class="hide" role="dialog" aria-label="Print preview"></div>
<div id="menu" class="hide" role="menu"></div>
<div id="dialog" class="hide" role="dialog"></div>
<div id="toast" class="hide" role="status"></div>
<input type="file" id="file" class="hide" accept=".docx,.docm">
<input type="file" id="picfile" class="hide" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp">

<script>
/* Opening files from the computer and saving back to the same file.
   Works when the app is installed (Open with… / double-click) and with the file picker. */
(function () {
  const L = window.EddyLink = { handle: null, o: null };
  L.canPick = typeof window.showOpenFilePicker === 'function';

  L.setup = function (o) {
    L.o = o;
    if ('launchQueue' in window && window.launchQueue && window.launchQueue.setConsumer) {
      window.launchQueue.setConsumer(async (p) => { if (p && p.files && p.files.length) await L.openHandle(p.files[0]); });
    }
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch((e) => console.warn('offline helper not registered', e)); });
    }
    L.sync();
  };

  /* name of the linked file, if Save can write straight back to it */
  L.name = function () { return L.handle ? L.handle.name : ''; };
  L.sync = function () { if (L.o && L.o.changed) L.o.changed(); };
  L.forget = function () { L.handle = null; L.sync(); };

  L.openHandle = async function (h) {
    try {
      const f = await h.getFile();
      const ok = await L.o.open(f);
      if (ok) { L.handle = h; L.sync(); }
      return ok;
    } catch (e) { console.error(e); L.o.toast('This file could not be opened: ' + (e && e.message ? e.message : e), 8000); return false; }
  };

  L.pick = async function () {
    if (!L.canPick) { L.o.fallbackPick(); return; }
    let hs;
    try { hs = await window.showOpenFilePicker({ types: L.o.types, multiple: false }); }
    catch (e) { if (e && e.name === 'AbortError') return; console.warn(e); L.o.fallbackPick(); return; }
    if (hs && hs[0]) await L.openHandle(hs[0]);
  };

  /* returns true when the bytes were written into the linked file */
  L.writeBack = async function (bytes) {
    const h = L.handle; L.lastError = null;
    if (!h || typeof h.createWritable !== 'function') return false;
    try {
      if (h.queryPermission) {
        let s = await h.queryPermission({ mode: 'readwrite' });
        if (s !== 'granted' && h.requestPermission) s = await h.requestPermission({ mode: 'readwrite' });
        if (s !== 'granted') { L.lastError = 'permission'; return false; }
      }
      const w = await h.createWritable(); await w.write(bytes); await w.close();
      return true;
    } catch (e) { console.error(e); L.lastError = e; return false; }
  };

  L.failText = function () {
    if (L.lastError === 'permission') return 'Eddy was not allowed to change the original file, so a copy was saved to your downloads folder instead.';
    return 'The original file could not be changed (it may be open in another program), so a copy was saved to your downloads folder instead.';
  };
})();

'use strict';
/* Eddy Doc — shared helpers */
const ED = window.ED = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const xesc = (s) => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const xattr = (s) => xesc(s).replace(/"/g, '&quot;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* CSS used for the document both on screen and when printing */
ED.DOC_CSS = `
.doc{font-family:Calibri,Carlito,Arial,sans-serif;font-size:14.67px;color:#000;line-height:1.15;word-wrap:break-word;overflow-wrap:break-word}
.doc p{margin:0;white-space:pre-wrap;tab-size:48px;-moz-tab-size:48px;min-height:1em}
.doc p[data-marker]::before{content:attr(data-marker);display:inline-block;min-width:var(--hang,24px);text-indent:0;font-style:normal;font-weight:inherit;text-decoration:none;white-space:pre}
.doc p[data-cont]::before{content:none}
.doc p[data-sect]::after{content:"Section break";display:block;margin-top:4px;border-top:1px dashed #9aa4b1;color:#8a94a1;font:10px Arial,sans-serif;text-align:center;padding-top:1px;text-indent:0}
.doc a{color:inherit;text-decoration:none}
.doc .va-sup{vertical-align:super;font-size:65%}.doc .va-sub{vertical-align:sub;font-size:65%}
.doc table.dtbl{border-collapse:collapse;table-layout:fixed;margin:0}
.doc table.dtbl td{vertical-align:top;padding:0 7px;overflow-wrap:break-word;word-wrap:break-word}
.doc table.dtbl td>p{white-space:pre-wrap}
.doc .atom{display:inline}
.doc .atomh,.doc .atomb{display:none}
.doc .pgb{display:block;height:0;margin:6px 0 14px;border-top:1px dashed #9aa4b1;position:relative;user-select:none}
.doc .pgb::after{content:"Page break";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#8a94a1;font:10px Arial,sans-serif;padding:0 6px}
.doc .fnref{vertical-align:super;font-size:65%;color:#2b579a}
.doc .shape{display:inline-block;max-width:100%;border:1px dashed #9aa4b1;background:#f6f7f9;color:#4b5360;padding:2px 6px;font-size:12px;white-space:pre-wrap;vertical-align:middle}
.doc img.dimg{max-width:none;vertical-align:bottom}
.doc .sdt{display:block}
.ppage{position:relative;background:#fff;overflow:hidden;color:#000}
.ppage .pbody{position:absolute;overflow:hidden}
.ppage .phdr,.ppage .pftr{position:absolute;overflow:hidden}
.ppage .pgb{border-top:0}.ppage .pgb::after{content:none}
.ppage p[data-sect]::after{content:none}

    v.onkeydown = (e) => { if (e.key === 'Escape' && $('dialog').classList.contains('hide')) P.close(); else if (e.target === v || e.target.tagName === 'BUTTON') { if (e.key === 'PageDown' || e.key === 'ArrowRight') v.querySelector('#pp-next').click(); else if (e.key === 'PageUp' || e.key === 'ArrowLeft') v.querySelector('#pp-prev').click(); } };
    rebuild(); v.querySelector('#pp-go').focus();
  };
  P.close = function () { $('printview').classList.add('hide'); $('printview').innerHTML = ''; doc.focus({ preventScroll: true }); };
  P.printHTML = function () { const s = ED.doc.sect; return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(ED.doc.name) + '</title><style>@page{size:' + (s.w / 1440) + 'in ' + (s.h / 1440) + 'in;margin:0}html,body{margin:0;padding:0}.ppage{page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.ppage:last-child{page-break-after:auto;break-after:auto}' + ED.DOC_CSS + '</style></head><body>' + V.sel.map((i) => V.html[i]).join('') + '</body></html>'; };
  P.print = function () {
    pick(); if (!V.sel.length) return ED.toast(V.err || 'Choose at least one page to print.');
    const old = $('printframe'); if (old) old.remove();
    const f = document.createElement('iframe'); f.id = 'printframe'; f.setAttribute('aria-hidden', 'true'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(f); const d = f.contentWindow.document; d.open(); d.write(P.printHTML()); d.close();
    const go = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { ED.toast('Printing could not start: ' + e.message); } };
    const imgs = Array.from(d.images); Promise.all(imgs.map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))).then(() => setTimeout(go, 150));
  };

  /* ---------- page setup ---------- */
  const PAPERS = { A4: [11906, 16838], Letter: [12240, 15840], Legal: [12240, 20160], 'F4 / Folio': [12189, 18709], A5: [8391, 11906], A3: [16838, 23811] };
  const MARGINS = { Normal: [1440, 1440, 1440, 1440], Narrow: [720, 720, 720, 720], Moderate: [1440, 1080, 1440, 1080], Wide: [1440, 2880, 1440, 2880] };
  function paperName(s) { const a = Math.min(s.w, s.h), b = Math.max(s.w, s.h); for (const k in PAPERS) { const [w, h] = PAPERS[k]; if (Math.abs(w - a) < 60 && Math.abs(h - b) < 60) return k; } return (a / 567).toFixed(1) + ' × ' + (b / 567).toFixed(1) + ' cm'; }
  const cm = (tw) => Math.round(tw / 567 * 100) / 100, tw = (c) => Math.round(+c * 567);
  ED.applySect = function (n) {
    Object.assign(ED.doc.sect, n);
    const ed = ED.sectEditor(); const sp = ED.frag(ED.doc.sectXml || '<w:sectPr/>'); ed(sp); ED.doc.sectXml = ED.ser(sp);
    for (const p of doc.querySelectorAll('p[data-sect]')) { const b = ED.base[p.dataset.b]; if (!b || !b.pPr) continue; const pPr = ED.frag(b.pPr); const s2 = ED.kid(pPr, 'sectPr'); if (!s2) continue; ed(s2); p.dataset.b = ED.keep({ pPr: ED.ser(pPr), pp: b.pp, tsp: b.tsp }); }
    ED.applyPageSize(); ED.afterEdit(true);
  };
  ED.pageSetup = function (after) {
    const s = ED.doc.sect; const cur = paperName(s); const d = $('dialog');
    const papers = Object.keys(PAPERS).map((k) => '<option' + (k === cur ? ' selected' : '') + '>' + k + '</option>').join('') + (PAPERS[cur] ? '' : '<option selected value="__cur">' + esc(cur) + ' (current)</option>');
    const curM = Object.keys(MARGINS).find((k) => { const m = MARGINS[k]; return Math.abs(m[0] - s.mt) < 30 && Math.abs(m[1] - s.mr) < 30 && Math.abs(m[2] - s.mb) < 30 && Math.abs(m[3] - s.ml) < 30; }) || 'Custom';
    d.innerHTML = '<h3>Page setup</h3><div class="two"><label class="f">Paper size<select id="ps-paper">' + papers + '</select></label><label class="f">Orientation<select id="ps-orient"><option value="portrait"' + (s.orient !== 'landscape' ? ' selected' : '') + '>Portrait</option><option value="landscape"' + (s.orient === 'landscape' ? ' selected' : '') + '>Landscape</option></select></label></div>' +
      '<label class="f">Margins<select id="ps-mpre">' + Object.keys(MARGINS).map((k) => '<option' + (k === curM ? ' selected' : '') + '>' + k + '</option>').join('') + '<option' + (curM === 'Custom' ? ' selected' : '') + '>Custom</option></select></label>' +
      '<div class="two"><label class="f">Top (cm)<input type="number" step="0.1" min="0" id="ps-t" value="' + cm(s.mt) + '"></label><label class="f">Bottom (cm)<input type="number" step="0.1" min="0" id="ps-b" value="' + cm(s.mb) + '"></label><label class="f">Left (cm)<input type="number" step="0.1" min="0" id="ps-l" value="' + cm(s.ml) + '"></label><label class="f">Right (cm)<input type="number" step="0.1" min="0" id="ps-r" value="' + cm(s.mr) + '"></label></div>' +
      '<div class="note">Applies to the whole document and is saved in the file.</div><div class="note" id="ps-err" style="color:var(--bad)"></div><div class="row"><button type="button" class="btn" id="ps-x">Cancel</button><button type="button" class="btn pri" id="ps-ok">Apply</button></div>';
    d.classList.remove('hide');
    const q = (id) => d.querySelector(id);
    q('#ps-mpre').addEventListener('change', () => { const m = MARGINS[q('#ps-mpre').value]; if (!m) return; q('#ps-t').value = cm(m[0]); q('#ps-r').value = cm(m[1]); q('#ps-b').value = cm(m[2]); q('#ps-l').value = cm(m[3]); });
    for (const id of ['#ps-t', '#ps-b', '#ps-l', '#ps-r']) q(id).addEventListener('input', () => { q('#ps-mpre').value = 'Custom'; });
    const close = () => { d.classList.add('hide'); d.innerHTML = ''; };
    q('#ps-x').addEventListener('click', close);
    d.onkeydown = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    q('#ps-ok').addEventListener('click', () => {
      let w = s.w, h = s.h; const pv = q('#ps-paper').value; if (PAPERS[pv]) [w, h] = PAPERS[pv]; else { w = Math.min(s.w, s.h); h = Math.max(s.w, s.h); }
      const orient = q('#ps-orient').value; if (orient === 'landscape') [w, h] = [Math.max(w, h), Math.min(w, h)]; else [w, h] = [Math.min(w, h), Math.max(w, h)];
      const n = { w, h, orient, mt: tw(q('#ps-t').value), mb: tw(q('#ps-b').value), ml: tw(q('#ps-l').value), mr: tw(q('#ps-r').value) };
      if ([n.mt, n.mb, n.ml, n.mr].some((x) => !isFinite(x) || x < 0)) { q('#ps-err').textContent = 'Margins must be numbers of 0 or more.'; return; }
      if (n.ml + n.mr > w - 1440 || n.mt + n.mb > h - 1440) { q('#ps-err').textContent = 'The margins are too wide for this paper. Leave at least 2.5 cm for the text.'; return; }
      close(); ED.pushUndo(); ED.applySect(n); ED.toast('Page setup: ' + paperName(n) + ', ' + orient + '.'); if (after) after();
    });
    q('#ps-paper').focus();
  };
})();

/* Eddy Doc — files, warnings, start-up */
(function () {
  const doc = $('doc');
  ED.syncTitle = function () { const linked = ED.linked(); $('btn-save').textContent = linked ? 'Save' : 'Save as .docx'; $('btn-save').title = linked ? 'Save your changes into ' + EddyLink.name() : 'Download the document as a Word file'; $('btn-copy').classList.toggle('hide', !linked); $('fname').textContent = ED.doc.name + (ED.dirty ? '  (unsaved changes)' : ''); document.title = ED.doc.name + ' — Eddy Doc'; };
  function showWarnings(list) {
    const w = $('warn'); list = (list || []).filter(Boolean);
    if (!list.length) { w.classList.add('hide'); w.innerHTML = ''; return; }
    w.innerHTML = '<ul>' + list.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul><button type="button" id="warn-x">Dismiss</button>'; w.classList.remove('hide');
    $('warn-x').addEventListener('click', () => w.classList.add('hide'));
  }
  function afterLoad(html) {
    doc.innerHTML = html; ED.undoState.stack = []; ED.undoState.redo = []; ED.dirty = false; ED.selImg = null; $('imgbox').classList.add('hide');
    ED.applyPageSize(); ED.normalize(); ED.renumber(); ED.contextual(); ED.fillStyles(); ED.fillFonts(); ED.syncTitle(); ED.syncToolbar();
    const w = (ED.doc.warnings || []).slice();
    if (doc.querySelector('p[data-sect]')) w.push('This document has more than one section. Eddy Doc shows and prints every page with one page size, and Page setup changes all sections.');
    showWarnings(w);
    $('scroller').scrollTop = 0;
    const first = doc.querySelector('p'); if (first) { const r = document.createRange(); r.setStart(first, 0); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    doc.focus({ preventScroll: true });
    ED.pages.layout(); ED.pages.marks(); ED.status();
  }
  ED.openFile = async function (file) {
    if (ED.dirty && !window.confirm('You have unsaved changes in ' + ED.doc.name + '. Open another file and lose them?')) return false;
    const name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
    if (ext === 'doc') { ED.toast('Old .doc files are not supported. Open it in Word and save it as .docx first.', 7000); return false; }
    if (ext !== 'docx' && ext !== 'docm') { ED.toast('Eddy Doc opens Word .docx files.', 5000); return false; }
    $('toast').classList.add('hide');
    try { const html = await ED.loadDocx(await file.arrayBuffer(), name); EddyLink.handle = null; afterLoad(html); return true; }
    catch (e) { console.error(e); ED.toast('This file could not be opened: ' + (e && e.message ? e.message : e), 8000); return false; }
  };
  ED.linked = () => !!EddyLink.handle && /\.(docx|docm)$/i.test(EddyLink.name());
  ED.save = async function (copy) {
    try {
      const bytes = await ED.saveDocx(); let name = ED.doc.name; if (!/\.(docx|docm)$/i.test(name)) name += '.docx';
      if (copy !== true && ED.linked()) {
        if (await EddyLink.writeBack(bytes)) { ED.dirty = false; ED.syncTitle(); ED.toast('Saved your changes to ' + EddyLink.name() + '.'); return; }
        ED.doc.name = name; ED.download(bytes, name, /\.docm$/i.test(name) ? 'application/vnd.ms-word.document.macroEnabled.12' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'); ED.dirty = false; ED.syncTitle(); ED.toast(EddyLink.failText(), 9000); return;
      }
      ED.doc.name = name; ED.download(bytes, name, /\.docm$/i.test(name) ? 'application/vnd.ms-word.document.macroEnabled.12' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
      ED.dirty = false; ED.syncTitle(); ED.toast('Saved ' + name + ' to your downloads folder.');
    } catch (e) { console.error(e); ED.toast('The file could not be saved: ' + (e && e.message ? e.message : e), 8000); }
  };
  $('btn-open').addEventListener('click', () => EddyLink.pick());
  $('file').addEventListener('change', () => { const f = $('file').files[0]; $('file').value = ''; if (f) ED.openFile(f); });
  $('btn-new').addEventListener('click', () => { if (ED.dirty && !window.confirm('You have unsaved changes. Start a new document and lose them?')) return; EddyLink.handle = null; afterLoad(ED.newDoc()); });
  $('btn-save').addEventListener('click', () => ED.save());
  $('btn-copy').addEventListener('click', () => ED.save(true));
  $('btn-print').addEventListener('click', () => ED.pages.open());
  $('btn-setup').addEventListener('click', () => ED.pageSetup());
  $('zoom').addEventListener('change', () => { $('page').style.zoom = $('zoom').value === '1' ? '' : $('zoom').value; ED.placeImgBox(); doc.focus({ preventScroll: true }); });
  document.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey || e.metaKey; if (!ctrl) return; const k = e.key.toLowerCase();
    if (!$('printview').classList.contains('hide')) { if (k === 'p') { e.preventDefault(); ED.pages.print(); } return; }
    if (k === 's') { e.preventDefault(); ED.save(); } else if (k === 'p') { e.preventDefault(); ED.pages.open(); } else if (k === 'o') { e.preventDefault(); EddyLink.pick(); }
  });
  let depth = 0; const isFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (e) => { if (isFiles(e)) { depth++; $('dropmsg').classList.remove('hide'); e.preventDefault(); } });
  window.addEventListener('dragover', (e) => { if (isFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('dropmsg').classList.add('hide'); });
  window.addEventListener('drop', (e) => {
    depth = 0; $('dropmsg').classList.add('hide'); if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (/^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name)) {
      let r = null; if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(e.clientX, e.clientY);
      if (r && doc.contains(r.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      ED.insertPicture(f);
    } else ED.openFile(f);
  });
  window.addEventListener('beforeunload', (e) => { if (ED.dirty) { e.preventDefault(); e.returnValue = ''; } });
  document.execCommand('defaultParagraphSeparator', false, 'p');
  afterLoad(ED.newDoc());
  EddyLink.setup({ open: (f) => ED.openFile(f), toast: (t, ms) => ED.toast(t, ms), fallbackPick: () => $('file').click(), changed: () => ED.syncTitle(),
    types: [{ description: 'Word document', accept: { 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'], 'application/vnd.ms-word.document.macroEnabled.12': ['.docm'] } }] });
  setTimeout(() => ED.doc.isNew && !EddyLink.handle && ED.toast('Start typing, or click "Open file" (or drop a Word file on this window) to open a .docx.', 6000), 400);
})();

</script>
